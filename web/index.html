<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CS Trade-Up Analyzer</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #1a1a2e;
    --surface: #16213e;
    --surface2: #0f3460;
    --border: #2a2a4a;
    --text: #e0e0e0;
    --text-muted: #888;
    --accent: #4b69ff;

    --rarity-0: #b0c3d9;
    --rarity-1: #5e98d9;
    --rarity-2: #4b69ff;
    --rarity-3: #8847ff;
    --rarity-4: #d32ce6;
    --rarity-5: #eb4b4b;
    --rarity-6: #e4ae39;

    --profit: #4caf50;
    --loss: #f44336;
    --warn: #ff9800;
  }

  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    background: var(--surface);
    border-bottom: 2px solid var(--accent);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  header h1 { font-size: 1.25rem; font-weight: 700; letter-spacing: 0.5px; }
  header span { color: var(--accent); }

  .layout {
    display: flex;
    flex: 1;
    overflow: hidden;
    height: calc(100vh - 55px);
  }

  /* ── Sidebar ── */
  .sidebar {
    width: 280px;
    min-width: 280px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .filter-group label {
    display: block;
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--text-muted);
    margin-bottom: 4px;
  }

  .filter-group select,
  .filter-group input[type="number"],
  .filter-group input[type="text"] {
    width: 100%;
    padding: 7px 10px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-size: 0.85rem;
    outline: none;
    transition: border-color 0.15s;
  }
  .filter-group select:focus,
  .filter-group input:focus { border-color: var(--accent); }

  .range-row { display: flex; gap: 6px; }
  .range-row input { width: 50%; }

  .btn-search {
    width: 100%;
    padding: 9px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 6px;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s;
    margin-top: 4px;
  }
  .btn-search:hover { opacity: 0.85; }

  .btn-reset {
    width: 100%;
    padding: 7px;
    background: transparent;
    color: var(--text-muted);
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 0.82rem;
    cursor: pointer;
    transition: color 0.15s, border-color 0.15s;
  }
  .btn-reset:hover { color: var(--text); border-color: var(--text-muted); }

  .sidebar-divider {
    border: none;
    border-top: 1px solid var(--border);
    margin: 2px 0;
  }

  /* ── Main content ── */
  .main {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .results-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 0.85rem;
    color: var(--text-muted);
  }

  /* ── Cards ── */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    cursor: pointer;
    transition: border-color 0.15s, transform 0.1s;
    display: grid;
    grid-template-columns: 4px 1fr auto;
    gap: 0 12px;
    align-items: center;
  }
  .card:hover { border-color: var(--accent); transform: translateY(-1px); }

  .card-stripe {
    grid-row: span 3;
    border-radius: 4px;
    width: 4px;
    height: 100%;
    align-self: stretch;
  }

  .card-title { font-weight: 600; font-size: 0.95rem; }
  .card-sub { font-size: 0.78rem; color: var(--text-muted); margin-top: 2px; }

  .card-stats {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 3px;
  }

  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 20px;
    font-size: 0.72rem;
    font-weight: 700;
    background: rgba(75,105,255,0.15);
    color: var(--accent);
    border: 1px solid rgba(75,105,255,0.3);
  }
  .badge.profit { background: rgba(76,175,80,0.15); color: var(--profit); border-color: rgba(76,175,80,0.3); }
  .badge.loss { background: rgba(244,67,54,0.15); color: var(--loss); border-color: rgba(244,67,54,0.3); }
  .badge.warn { background: rgba(255,152,0,0.15); color: var(--warn); border-color: rgba(255,152,0,0.3); }

  .card-price { font-size: 0.82rem; color: var(--text-muted); }

  /* ── Pagination ── */
  .pagination {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 8px 0;
  }
  .pagination button {
    padding: 6px 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    cursor: pointer;
    font-size: 0.82rem;
    transition: border-color 0.15s;
  }
  .pagination button:hover:not(:disabled) { border-color: var(--accent); }
  .pagination button:disabled { opacity: 0.4; cursor: default; }
  .pagination .page-info { font-size: 0.82rem; color: var(--text-muted); min-width: 100px; text-align: center; }

  /* ── Empty / loading states ── */
  .state-msg {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-muted);
    font-size: 0.9rem;
  }
  .state-msg .icon { font-size: 2.5rem; margin-bottom: 12px; }

  /* ── Detail panel (right drawer) ── */
  .detail-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 100;
  }
  .detail-overlay.open { display: block; }

  .detail-panel {
    position: fixed;
    top: 0;
    right: -520px;
    width: 520px;
    max-width: 100vw;
    height: 100vh;
    background: var(--surface);
    border-left: 1px solid var(--border);
    overflow-y: auto;
    z-index: 101;
    transition: right 0.25s ease;
    padding: 0;
  }
  .detail-panel.open { right: 0; }

  .detail-header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    position: sticky;
    top: 0;
    background: var(--surface);
    z-index: 1;
  }
  .detail-header h2 { font-size: 1rem; font-weight: 700; line-height: 1.3; }
  .detail-header .sub { font-size: 0.78rem; color: var(--text-muted); margin-top: 3px; }

  .btn-close {
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 1.3rem;
    cursor: pointer;
    padding: 4px;
    line-height: 1;
    flex-shrink: 0;
  }
  .btn-close:hover { color: var(--text); }

  .detail-body { padding: 16px 20px; display: flex; flex-direction: column; gap: 16px; }

  .detail-section h3 {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--text-muted);
    margin-bottom: 8px;
  }

  .stat-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .stat-box {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
  }
  .stat-box .label { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
  .stat-box .value { font-size: 1.1rem; font-weight: 700; margin-top: 2px; }
  .stat-box .value.profit { color: var(--profit); }
  .stat-box .value.loss { color: var(--loss); }
  .stat-box .value.accent { color: var(--accent); }

  .input-skin-card {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 6px;
  }
  .input-skin-card .skin-name { font-weight: 600; font-size: 0.88rem; }
  .input-skin-card .skin-detail { font-size: 0.76rem; color: var(--text-muted); margin-top: 3px; }

  .breakdown-item {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 6px;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 4px;
  }
  .breakdown-item .skin-name { font-size: 0.85rem; font-weight: 500; }
  .breakdown-item .wear-tag { font-size: 0.72rem; color: var(--text-muted); }
  .breakdown-item .price-col { text-align: right; }
  .breakdown-item .profit-val { font-size: 0.85rem; font-weight: 700; }
  .breakdown-item .chance-val { font-size: 0.72rem; color: var(--text-muted); }

  .crate-label {
    font-size: 0.78rem;
    color: var(--accent);
    font-weight: 600;
    margin-bottom: 4px;
    margin-top: 8px;
  }
  .crate-label:first-child { margin-top: 0; }

  .warn-banner {
    background: rgba(255,152,0,0.1);
    border: 1px solid rgba(255,152,0,0.3);
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 0.8rem;
    color: var(--warn);
  }

  .spinner {
    width: 32px; height: 32px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    margin: 0 auto 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Rarity color helpers */
  .r0 { color: var(--rarity-0); }
  .r1 { color: var(--rarity-1); }
  .r2 { color: var(--rarity-2); }
  .r3 { color: var(--rarity-3); }
  .r4 { color: var(--rarity-4); }
  .r5 { color: var(--rarity-5); }
  .r6 { color: var(--rarity-6); }

  .bg-r0 { background-color: var(--rarity-0); }
  .bg-r1 { background-color: var(--rarity-1); }
  .bg-r2 { background-color: var(--rarity-2); }
  .bg-r3 { background-color: var(--rarity-3); }
  .bg-r4 { background-color: var(--rarity-4); }
  .bg-r5 { background-color: var(--rarity-5); }
  .bg-r6 { background-color: var(--rarity-6); }
</style>
</head>
<body>

<header>
  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" style="flex-shrink:0">
    <circle cx="12" cy="12" r="10" stroke="#4b69ff" stroke-width="2"/>
    <path d="M8 12l3 3 5-5" stroke="#4b69ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <h1>CS Trade-Up <span>Analyzer</span></h1>
</header>

<div class="layout">
  <!-- Sidebar filters -->
  <aside class="sidebar">
    <div class="filter-group">
      <label>Rarity (output)</label>
      <select id="f-rarity">
        <option value="">Any</option>
        <option value="1">Industrial</option>
        <option value="2">Mil-Spec</option>
        <option value="3">Restricted</option>
        <option value="4">Classified</option>
        <option value="5">Covert</option>
      </select>
    </div>

    <div class="filter-group">
      <label>Wear (output)</label>
      <select id="f-wear">
        <option value="">Any</option>
        <option value="0">Factory New</option>
        <option value="1">Minimal Wear</option>
        <option value="2">Field-Tested</option>
        <option value="3">Well-Worn</option>
        <option value="4">Battle-Scarred</option>
      </select>
    </div>

    <div class="filter-group">
      <label>Weapon (output)</label>
      <select id="f-weapon">
        <option value="">Any</option>
      </select>
    </div>

    <hr class="sidebar-divider">

    <div class="filter-group">
      <label>Input price range ($)</label>
      <div class="range-row">
        <input type="number" id="f-min-price" placeholder="Min" min="0" step="0.01">
        <input type="number" id="f-max-price" placeholder="Max" min="0" step="0.01">
      </div>
    </div>

    <div class="filter-group">
      <label>Input wear range</label>
      <div class="range-row">
        <input type="number" id="f-min-wear" placeholder="Min" min="0.001" max="1" step="0.001" value="0.001">
        <input type="number" id="f-max-wear" placeholder="Max" min="0.001" max="1" step="0.001" value="1">
      </div>
    </div>

    <div class="filter-group">
      <label>ROI (10 trades) range (%)</label>
      <div class="range-row">
        <input type="number" id="f-roi-min" placeholder="Min" step="0.1">
        <input type="number" id="f-roi-max" placeholder="Max" step="0.1">
      </div>
    </div>

    <div class="filter-group">
      <label>Max wear margin (0–1)</label>
      <input type="number" id="f-max-margin" placeholder="1" min="0" max="1" step="0.01" value="1">
    </div>

    <hr class="sidebar-divider">

    <div class="filter-group">
      <label>Sort by</label>
      <select id="f-sort">
        <option value="chance">Chance</option>
        <option value="roi_10">ROI (10)</option>
        <option value="profit_10">Profit (10)</option>
        <option value="input_price">Input Price</option>
      </select>
    </div>

    <button class="btn-search" onclick="search(0)">Search</button>
    <button class="btn-reset" onclick="resetFilters()">Reset filters</button>
  </aside>

  <!-- Results -->
  <main class="main" id="main">
    <div class="state-msg">
      <div class="icon">🔍</div>
      <div>Set your filters and press <strong>Search</strong> to find profitable trade-ups.</div>
    </div>
  </main>
</div>

<!-- Detail overlay + panel -->
<div class="detail-overlay" id="overlay" onclick="closeDetail()"></div>
<div class="detail-panel" id="detail-panel">
  <div class="detail-header">
    <div>
      <h2 id="dp-title">Trade-Up Details</h2>
      <div class="sub" id="dp-sub"></div>
    </div>
    <button class="btn-close" onclick="closeDetail()">✕</button>
  </div>
  <div class="detail-body" id="dp-body"></div>
</div>

<script>
const RARITY_NAMES = {0:"Consumer",1:"Industrial",2:"Mil-Spec",3:"Restricted",4:"Classified",5:"Covert",6:"Exceedingly Rare"};
const WEAR_NAMES   = {0:"Factory New",1:"Minimal Wear",2:"Field-Tested",3:"Well-Worn",4:"Battle-Scarred"};

let currentPage = 0;
let currentTotal = 0;

// Load weapon list on startup
fetch('/api/weapons')
  .then(r => r.json())
  .then(weapons => {
    const sel = document.getElementById('f-weapon');
    Object.entries(weapons).sort((a,b) => a[1].localeCompare(b[1])).forEach(([id, name]) => {
      const o = document.createElement('option');
      o.value = id;
      o.textContent = name;
      sel.appendChild(o);
    });
  });

function getFilters() {
  return {
    rarity:     document.getElementById('f-rarity').value,
    wear:       document.getElementById('f-wear').value,
    weapon:     document.getElementById('f-weapon').value,
    min_price:  document.getElementById('f-min-price').value,
    max_price:  document.getElementById('f-max-price').value,
    min_wear:   document.getElementById('f-min-wear').value || 0.001,
    max_wear:   document.getElementById('f-max-wear').value || 1,
    roi_min:    document.getElementById('f-roi-min').value
                  ? document.getElementById('f-roi-min').value / 100 : '',
    roi_max:    document.getElementById('f-roi-max').value
                  ? document.getElementById('f-roi-max').value / 100 : '',
    max_margin: document.getElementById('f-max-margin').value || 1,
    sort_by:    document.getElementById('f-sort').value,
  };
}

function buildQuery(filters, page) {
  const p = new URLSearchParams();
  if (filters.rarity)    p.set('rarity',     filters.rarity);
  if (filters.wear !== '') p.set('wear',      filters.wear);
  if (filters.weapon)    p.set('weapon',     filters.weapon);
  if (filters.min_price) p.set('min_price',  filters.min_price);
  if (filters.max_price) p.set('max_price',  filters.max_price);
  p.set('min_wear',   filters.min_wear);
  p.set('max_wear',   filters.max_wear);
  if (filters.roi_min !== '') p.set('roi_min', filters.roi_min);
  if (filters.roi_max !== '') p.set('roi_max', filters.roi_max);
  p.set('max_margin', filters.max_margin);
  p.set('sort_by',    filters.sort_by);
  p.set('page',       page);
  return p.toString();
}

function search(page) {
  currentPage = page;
  const filters = getFilters();
  const main = document.getElementById('main');
  main.innerHTML = `<div class="state-msg"><div class="spinner"></div><div>Searching…</div></div>`;

  fetch(`/api/tradeups?${buildQuery(filters, page)}`)
    .then(r => r.json())
    .then(data => renderResults(data))
    .catch(() => {
      main.innerHTML = `<div class="state-msg"><div class="icon">⚠️</div><div>Failed to connect to the server.</div></div>`;
    });
}

function renderResults(data) {
  const main = document.getElementById('main');
  currentTotal = data.total;

  if (!data.tradeups || data.tradeups.length === 0) {
    main.innerHTML = `<div class="state-msg"><div class="icon">😶</div><div>No trade-ups found matching that criteria.</div></div>`;
    return;
  }

  const totalPages = Math.ceil(data.total / data.per_page);
  let html = `<div class="results-header">
    <span>${data.total.toLocaleString()} result${data.total !== 1 ? 's' : ''}</span>
    <span>Page ${data.page + 1} of ${totalPages}</span>
  </div>`;

  data.tradeups.forEach(t => {
    const r = t.goal_rarity;
    const profitClass = t.possible_profit === null ? '' : t.possible_profit > 0 ? 'profit' : 'loss';
    const profitText  = t.possible_profit === null ? 'N/A'
                      : (t.possible_profit > 0 ? '+' : '') + '$' + t.possible_profit.toFixed(2);
    const roiText = (t.roi_10 * 100).toFixed(1) + '%';
    const warn = t.price_warning ? ' ⚠' : '';

    html += `<div class="card" onclick="openDetail(${t.id})">
      <div class="card-stripe bg-r${r}"></div>
      <div>
        <div class="card-title r${r}">${t.goal_weapon} | ${t.goal_skin.name}${warn}</div>
        <div class="card-sub">${t.goal_rarity_name} · ${t.goal_wear_name} · ID #${t.id}</div>
        <div class="card-sub" style="margin-top:4px">
          Input: $${t.input_price.toFixed(2)} &nbsp;·&nbsp;
          Chance: ${(t.chance * 100).toFixed(0)}% &nbsp;·&nbsp;
          ${t.skin_1_count}× ${t.skin_1.weapon} | ${t.skin_1.name}
          ${t.skin_2 ? ` + ${t.skin_2_count}× ${t.skin_2.weapon} | ${t.skin_2.name}` : ''}
        </div>
      </div>
      <div class="card-stats">
        <span class="badge ${profitClass}">${profitText}</span>
        <span class="badge">ROI ${roiText}</span>
      </div>
    </div>`;
  });

  // Pagination
  html += `<div class="pagination">
    <button onclick="search(${currentPage - 1})" ${currentPage === 0 ? 'disabled' : ''}>← Prev</button>
    <span class="page-info">Page ${currentPage + 1} / ${totalPages}</span>
    <button onclick="search(${currentPage + 1})" ${currentPage >= totalPages - 1 ? 'disabled' : ''}>Next →</button>
  </div>`;

  main.innerHTML = html;
}

function openDetail(id) {
  const panel = document.getElementById('detail-panel');
  const overlay = document.getElementById('overlay');
  const body = document.getElementById('dp-body');
  const title = document.getElementById('dp-title');
  const sub = document.getElementById('dp-sub');

  title.textContent = 'Loading…';
  sub.textContent = '';
  body.innerHTML = `<div class="state-msg"><div class="spinner"></div></div>`;
  panel.classList.add('open');
  overlay.classList.add('open');

  fetch(`/api/tradeups/${id}`)
    .then(r => r.json())
    .then(t => renderDetail(t))
    .catch(() => { body.innerHTML = `<div class="state-msg">Failed to load details.</div>`; });
}

function closeDetail() {
  document.getElementById('detail-panel').classList.remove('open');
  document.getElementById('overlay').classList.remove('open');
}

function renderDetail(t) {
  const title = document.getElementById('dp-title');
  const sub = document.getElementById('dp-sub');
  const body = document.getElementById('dp-body');

  title.innerHTML = `<span class="r${t.goal_rarity}">${t.goal_weapon} | ${t.goal_skin.name}</span>`;
  sub.textContent = `${t.goal_rarity_name} · ${t.goal_wear_name} · Trade-Up #${t.id}`;

  const roiColor = t.roi_10 >= 0 ? 'profit' : 'loss';
  const profitColor = (t.possible_profit || 0) >= 0 ? 'profit' : 'loss';

  let html = '';

  // Warning banner
  if (t.price_warning) {
    html += `<div class="warn-banner">⚠ Price data may be unreliable for one or more skins in this trade-up.</div>`;
  }

  // Key stats
  html += `<div class="detail-section">
    <h3>Overview</h3>
    <div class="stat-grid">
      <div class="stat-box">
        <div class="label">Success Chance</div>
        <div class="value accent">${(t.chance * 100).toFixed(1)}%</div>
      </div>
      <div class="stat-box">
        <div class="label">Input Cost</div>
        <div class="value">$${t.input_price.toFixed(2)}</div>
      </div>
      <div class="stat-box">
        <div class="label">Possible Profit</div>
        <div class="value ${profitColor}">${t.possible_profit !== null ? (t.possible_profit >= 0 ? '+' : '') + '$' + t.possible_profit.toFixed(2) : 'N/A'}</div>
      </div>
      <div class="stat-box">
        <div class="label">Output Price</div>
        <div class="value">${t.goal_price !== null ? '$' + t.goal_price.toFixed(2) : 'N/A'}</div>
      </div>
    </div>
  </div>`;

  // Simulated results
  html += `<div class="detail-section">
    <h3>Simulation Results</h3>
    <div class="stat-grid">
      <div class="stat-box">
        <div class="label">ROI (10 trades)</div>
        <div class="value ${t.roi_10 >= 0 ? 'profit' : 'loss'}">${(t.roi_10 * 100).toFixed(2)}%</div>
      </div>
      <div class="stat-box">
        <div class="label">Profit (10 trades)</div>
        <div class="value ${t.profit_10 >= 0 ? 'profit' : 'loss'}">${t.profit_10 >= 0 ? '+' : ''}$${t.profit_10.toFixed(2)}</div>
      </div>
      <div class="stat-box">
        <div class="label">ROI (100 trades)</div>
        <div class="value ${t.roi_100 >= 0 ? 'profit' : 'loss'}">${(t.roi_100 * 100).toFixed(2)}%</div>
      </div>
      <div class="stat-box">
        <div class="label">Profit (100 trades)</div>
        <div class="value ${t.profit_100 >= 0 ? 'profit' : 'loss'}">${t.profit_100 >= 0 ? '+' : ''}$${t.profit_100.toFixed(2)}</div>
      </div>
    </div>
  </div>`;

  // Input skins
  html += `<div class="detail-section"><h3>Input Skins (10 total)</h3>`;
  html += `<div class="input-skin-card">
    <div class="skin-name r${t.skin_1.rarity}">${t.skin_1_count}× ${t.skin_1.weapon} | ${t.skin_1.name}</div>
    <div class="skin-detail">Max wear: ${t.skin_1_max_wear} &nbsp;·&nbsp; Price: $${t.skin_1_price.toFixed(2)} each &nbsp;·&nbsp; Margin: ${t.skin_1_margin}</div>
  </div>`;
  if (t.skin_2) {
    html += `<div class="input-skin-card">
      <div class="skin-name r${t.skin_2.rarity}">${t.skin_2_count}× ${t.skin_2.weapon} | ${t.skin_2.name}</div>
      <div class="skin-detail">Max wear: ${t.skin_2_max_wear} &nbsp;·&nbsp; Price: $${t.skin_2_price.toFixed(2)} each &nbsp;·&nbsp; Margin: ${t.skin_2_margin}</div>
    </div>`;
  }
  html += `</div>`;

  // Profit breakdown
  if (t.breakdown && t.breakdown.length > 0) {
    html += `<div class="detail-section"><h3>Profit Breakdown</h3>`;

    t.breakdown.forEach(group => {
      html += `<div class="crate-label">${group.crate_name}</div>`;
      group.outcomes.forEach(o => {
        const pColor = o.profit === null ? '' : o.profit > 0 ? 'profit' : 'loss';
        const pText  = o.profit === null ? 'N/A'
                     : (o.profit > 0 ? '+' : '') + '$' + o.profit.toFixed(2);
        html += `<div class="breakdown-item">
          <div>
            <div class="skin-name r${o.skin.rarity}">${o.skin.weapon} | ${o.skin.name}</div>
            <div class="wear-tag">${o.wear} · ${o.chance.toFixed(1)}% chance</div>
          </div>
          <div class="price-col">
            <div class="profit-val ${pColor}">${pText}</div>
            <div class="chance-val">${o.price !== null ? '$' + o.price.toFixed(2) : 'No price'}</div>
          </div>
        </div>`;
      });
    });

    html += `<div class="stat-grid" style="margin-top:8px">
      <div class="stat-box">
        <div class="label">Profit chance</div>
        <div class="value profit">${t.profit_chance.toFixed(1)}%</div>
      </div>
      <div class="stat-box">
        <div class="label">Loss chance</div>
        <div class="value loss">${t.loss_chance.toFixed(1)}%</div>
      </div>
    </div>`;

    html += `</div>`;
  }

  body.innerHTML = html;
}

function resetFilters() {
  document.getElementById('f-rarity').value = '';
  document.getElementById('f-wear').value = '';
  document.getElementById('f-weapon').value = '';
  document.getElementById('f-min-price').value = '';
  document.getElementById('f-max-price').value = '';
  document.getElementById('f-min-wear').value = '0.001';
  document.getElementById('f-max-wear').value = '1';
  document.getElementById('f-roi-min').value = '';
  document.getElementById('f-roi-max').value = '';
  document.getElementById('f-max-margin').value = '1';
  document.getElementById('f-sort').value = 'chance';
}

// Close detail panel on Escape
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDetail(); });
</script>
</body>
</html>
